<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Lịch Học Kỳ</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="flex">
    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar(activePage='lichhocky')}"></div>

    <!-- Main Content -->
    <div class="flex-1 p-6 space-y-6 ml-64 max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold text-blue-700 mb-4">Quản Lý Lịch Học Kỳ</h1>

        <!-- Toast -->
        <div class="fixed top-8 left-1/2 transform -translate-x-1/2 z-50 space-y-2 w-full max-w-md px-4">
            <div th:if="${success}" class="toast bg-green-500 text-white px-4 py-2 rounded shadow-lg" th:text="${success}"></div>
            <div th:if="${error}" class="toast bg-red-500 text-white px-4 py-2 rounded shadow-lg" th:text="${error}"></div>
        </div>

        <!-- Form Thêm / Sửa -->
        <div class="bg-white p-6 rounded-lg shadow-md form-container">
            <h4 class="text-xl font-semibold mb-4" th:text="${isEdit} ? 'Cập nhật lịch học kỳ' : 'Thêm lịch học kỳ'"></h4>
            <form th:action="${isEdit} ? @{/lichhocky/update/{id}(id=${lichHocKyId})} : @{/lichhocky/save}" 
                  th:object="${lichHocKy_DTO_}" method="post" class="needs-validation space-y-4" novalidate>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block font-medium">Lớp Tín Chỉ *</label>
                        <select th:field="*{lopTinChiId}" class="w-full border p-2 rounded-md">
                            <option value="">Chọn lớp</option>
                            <option th:each="ltc : ${lopTinChiList}" th:value="${ltc.lopTinChiId}" th:text="${ltc.lopTinChiId + ' - ' + ltc.tenLopTinChi}"></option>
                        </select>
                        <span th:errors="*{lopTinChiId}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Học Phần *</label>
                        <select th:field="*{maHocPhan}" class="w-full border p-2 rounded-md">
                            <option value="">Chọn học phần</option>
                            <option th:each="hp : ${hocPhanList}" th:value="${hp.maHocPhan}" th:text="${hp.maHocPhan + ' - ' + hp.tenHocPhan}"></option>
                        </select>
                        <span th:errors="*{maHocPhan}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Giảng Viên *</label>
                        <select th:field="*{maGiangVien}" class="w-full border p-2 rounded-md">
                            <option value="">Chọn giảng viên</option>
                            <option th:each="gv : ${giangVienList}" th:value="${gv.maGiangVien}" th:text="${gv.maGiangVien + ' - ' + gv.tenGiangVien}"></option>
                        </select>
                        <span th:errors="*{maGiangVien}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Phòng Học *</label>
                        <select th:field="*{maPhong}" class="w-full border p-2 rounded-md">
                            <option value="">Chọn phòng</option>
                            <option th:each="ph : ${phongHocList}" th:value="${ph.maPhong}" th:text="${ph.maPhong + ' - ' + ph.tenPhong}"></option>
                        </select>
                        <span th:errors="*{maPhong}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Học Kỳ *</label>
                        <select th:field="*{hocKy}" class="w-full border p-2 rounded-md">
                            <option value="">Chọn học kỳ</option>
                            <option th:each="hk : ${hocKyList}" th:value="${hk}" th:text="${hk.value}"></option>
                        </select>
                        <span th:errors="*{hocKy}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Năm Học *</label>
                        <input type="text" th:field="*{namHoc}" class="w-full border p-2 rounded-md" />
                        <span th:errors="*{namHoc}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Thời Gian Học *</label>
                        <input type="text" th:field="*{thoiGianHoc}" class="w-full border p-2 rounded-md" />
                        <span th:errors="*{thoiGianHoc}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Ca Học *</label>
                        <select th:field="*{caHoc}" class="w-full border p-2 rounded-md">
                            <option value="">Chọn</option>
                            <option th:each="ca : ${caHocList}" th:value="${ca}" th:text="${ca.value}"></option>
                        </select>
                        <span th:errors="*{caHoc}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Ngày Bắt Đầu *</label>
                        <input type="date" th:field="*{ngayBatDauHoc}" class="w-full border p-2 rounded-md" />
                        <span th:errors="*{ngayBatDauHoc}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Ngày Kết Thúc *</label>
                        <input type="date" th:field="*{ngayKetThucHoc}" class="w-full border p-2 rounded-md" />
                        <span th:errors="*{ngayKetThucHoc}" class="text-sm text-red-500"></span>
                    </div>
                </div>
                <div class="flex space-x-2 mt-4">
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Lưu</button>
                    <a th:href="@{/lichhocky}" class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">Hủy</a>
                </div>
            </form>
        </div>

        <!-- Lọc -->
        <form th:action="@{/lichhocky}" method="get" class="bg-white p-4 rounded-md shadow space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                <input type="text" name="maLopTinChi" class="border p-2 rounded-md" placeholder="Mã lớp tín chỉ" th:value="${maLopTinChi}">
                <input type="text" name="maHocPhan" class="border p-2 rounded-md" placeholder="Mã học phần" th:value="${maHocPhan}">
                <input type="text" name="hocKy" class="border p-2 rounded-md" placeholder="Học kỳ" th:value="${hocKy}">
                <input type="text" name="namHoc" class="border p-2 rounded-md" placeholder="Năm học" th:value="${namHoc}">
            </div>
            <button type="submit" class="bg-gray-600 text-white px-4 py-2 rounded hover:bg-gray-700">Lọc</button>
        </form>

        <!-- Danh sách -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Danh Sách Lịch Học Kỳ</h2>
            <table class="w-full table-auto border-collapse">
                <thead class="bg-blue-100">
                    <tr>
                        <th class="p-2 border">Lớp Tín Chỉ</th>
                        <th class="p-2 border">Học Phần</th>
                        <th class="p-2 border">Giảng Viên</th>
                        <th class="p-2 border">Phòng</th>
                        <th class="p-2 border">Học Kỳ</th>
                        <th class="p-2 border">Năm</th>
                        <th class="p-2 border">Ca</th>
                        <th class="p-2 border">TG Học</th>
                        <th class="p-2 border">Bắt Đầu</th>
                        <th class="p-2 border">Kết Thúc</th>
                        <th class="p-2 border">Hành Động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="lich : ${lichHocKyPage.content}" class="hover:bg-gray-100">
                        <td class="p-2 border" th:text="${lich.tenLopTinChi}"></td>
                        <td class="p-2 border" th:text="${lich.tenHocPhan}"></td>
                        <td class="p-2 border" th:text="${lich.tenGiangVien}"></td>
                        <td class="p-2 border" th:text="${lich.tenPhong}"></td>
                        <td class="p-2 border" th:text="${lich.hocKy.value}"></td>
                        <td class="p-2 border" th:text="${lich.namHoc}"></td>
                        <td class="p-2 border" th:text="${lich.caHoc.value}"></td>
                        <td class="p-2 border" th:text="${lich.thoiGianHoc}"></td>
                        <td class="p-2 border" th:text="${lich.ngayBatDauHoc}"></td>
                        <td class="p-2 border" th:text="${lich.ngayKetThucHoc}"></td>
                        <td class="p-2 border space-x-2 text-sm">
                            <a th:href="@{/lichhocky/edit/{id}(id=${lich.lichHocKyID})}" class="text-blue-600 hover:underline">Sửa</a>
                            <a th:href="@{/lichhocky/delete/{id}(id=${lich.lichHocKyID})}" class="text-red-600 hover:underline" onclick="return confirm('Bạn có chắc muốn xóa?')">Xóa</a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Phân trang -->
            <div class="mt-4 flex justify-between items-center">
                <span>Trang <span th:text="${lichHocKyPage.number + 1}"></span> / <span th:text="${lichHocKyPage.totalPages}"></span></span>
                <div class="space-x-2">
                    <a th:href="@{/lichhocky(page=${lichHocKyPage.number - 1})}" th:if="${lichHocKyPage.hasPrevious()}" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">Trước</a>
                    <a th:href="@{/lichhocky(page=${lichHocKyPage.number + 1})}" th:if="${lichHocKyPage.hasNext()}" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">Sau</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Toast auto-hide -->
<script>
    window.addEventListener('DOMContentLoaded', () => {
        const toasts = document.querySelectorAll('.toast');
        toasts.forEach(toast => {
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-5');
            }, 3000);
        });
    });
</script>

</body>
</html>
