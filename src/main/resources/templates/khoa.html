<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Khoa</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="flex">
    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar(activePage='khoa')}"></div>

    <!-- Main Content -->
    <div class="flex-1 p-6 space-y-6 ml-64 max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-blue-700 mb-4">Quản Lý Khoa</h1>

        <!-- Thông báo lỗi -->
        <div th:if="${error}" class="bg-red-100 text-red-700 px-4 py-2 rounded-md border border-red-400">
            <p th:text="${error}"></p>
        </div>

        <!-- Form thêm/sửa khoa -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Thêm / Sửa Khoa</h2>
            <form th:action="@{/khoa/save}" th:object="${khoaReq}" method="post" class="space-y-4">
                <input type="hidden" name="page" th:value="${khoaPage.number}" />
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
			    <div>
			        <label class="block font-medium">Mã Khoa *</label>
			        <input type="text" th:field="*{maKhoa}" class="w-full border border-gray-300 p-2 rounded-md" />
			        <span th:errors="*{maKhoa}" class="text-sm text-red-500"></span>
			    </div>
			    <div>
			        <label class="block font-medium">Tên Khoa *</label>
			        <input type="text" th:field="*{tenKhoa}" class="w-full border border-gray-300 p-2 rounded-md" />
			        <span th:errors="*{tenKhoa}" class="text-sm text-red-500"></span>
			    </div>
				</div>

                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Lưu</button>
            </form>
        </div>

        <!-- Danh sách khoa -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Danh Sách Khoa</h2>
            <table class="w-full table-auto border-collapse">
                <thead>
                    <tr class="bg-blue-100 text-left">
                        <th class="p-2 border">Mã Khoa</th>
                        <th class="p-2 border">Tên Khoa</th>
                        <th class="p-2 border">Hành Động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="khoa : ${khoaPage.content}" class="hover:bg-gray-100">
                        <td class="p-2 border" th:text="${khoa.maKhoa}"></td>
                        <td class="p-2 border" th:text="${khoa.tenKhoa}"></td>
                        <td class="p-2 border space-x-2 text-sm">
   						 <!-- Nút sửa -->
   						 <a th:href="@{/khoa/edit/{maKhoa}(maKhoa=${khoa.maKhoa})}"
     						  class="text-blue-600 hover:underline">  Sửa</a>

    					<!-- Nút xóa -->
   						 <a th:href="@{/khoa/delete/{maKhoa}(maKhoa=${khoa.maKhoa})}"
       						class="text-red-600 hover:underline"
       					onclick="return confirm('Bạn có chắc chắn muốn xóa khoa này không?')">Xóa </a>
						</td>
                    </tr>
                </tbody>
            </table>

            <!-- Phân trang -->
            <div class="mt-4 flex justify-between items-center">
                <span>
                    Trang <span th:text="${khoaPage.number + 1}"></span> / <span th:text="${khoaPage.totalPages}"></span>
                </span>
                <div class="space-x-2">
                    <a th:href="@{/khoa(page=${khoaPage.number - 1})}" th:if="${khoaPage.hasPrevious()}" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">Trước</a>
                    <a th:href="@{/khoa(page=${khoaPage.number + 1})}" th:if="${khoaPage.hasNext()}" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">Sau</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
