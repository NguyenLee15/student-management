<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Header</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<header th:fragment="header" class="bg-blue-900 text-white px-6 py-4 ml-64 shadow-md flex items-center justify-between">
    <div class="flex items-center space-x-4">
        <h1 class="text-xl font-bold tracking-wide">Hệ Thống Quản Lý Sinh Viên</h1>
    </div>

    <nav class="flex items-center space-x-6">
        <span sec:authorize="isAuthenticated()" class="text-white text-lg">
            Xin chào, <span class="font-semibold text-yellow-300" th:text="${username}">Người dùng</span>
        </span>
        <a th:href="@{/logout}" sec:authorize="isAuthenticated()" 
           class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md text-sm shadow-md transition duration-200">
            Đăng xuất
        </a>
    </nav>
</header>
</body>
</html>
