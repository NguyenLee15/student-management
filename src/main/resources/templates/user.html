<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <title>Quản Lý Người Dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen font-sans">

    <!-- Header -->
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar(activePage='user')}"></div>

        <!-- Main Content -->
       <main class="flex-1 p-6 space-y-6 ml-64 max-w-6xl mx-auto">

            <h1 class="text-3xl font-bold text-blue-700 mb-6">Quản Lý Người Dùng</h1>

            <!-- Thông báo lỗi -->
            <div th:if="${error}" class="bg-red-100 text-red-700 px-4 py-2 rounded-md border border-red-400 mb-6">
                <p th:text="${error}"></p>
            </div>

            <!-- Form thêm/sửa người dùng -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4">Thêm Người Dùng</h2>
                <form th:action="@{/user/create}" th:object="${userReq}" method="post" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block font-medium mb-1">Tên đăng nhập *</label>
                        <input type="text" th:field="*{userName}" class="w-full border border-gray-300 p-2 rounded-md" />
                        <span th:errors="*{userName}" class="text-sm text-red-500"></span>
                    </div>

                    <div>
                        <label class="block font-medium mb-1">Mật khẩu *</label>
                        <input type="password" th:field="*{password}" class="w-full border border-gray-300 p-2 rounded-md" />
                        <span th:errors="*{password}" class="text-sm text-red-500"></span>
                    </div>

                    <div>
                        <label class="block font-medium mb-1">Vai trò *</label>
                        <select th:field="*{role}" class="w-full border border-gray-300 p-2 rounded-md">
                            <option th:each="role : ${roles}" th:value="${role.name()}" th:text="${role.getRole()}"></option>
                        </select>
                        <span th:errors="*{role}" class="text-sm text-red-500"></span>
                    </div>

                    <div class="md:col-span-3 flex space-x-4 mt-4">
                        <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition">Lưu</button>
                    </div>
                </form>
            </div>

            <!-- Danh sách người dùng -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4">Danh Sách Người Dùng</h2>
                <div class="overflow-x-auto">
                    <table class="w-full table-auto border-collapse border border-gray-200">
                        <thead class="bg-blue-100 text-left">
                            <tr>
                                <th class="p-2 border">Tên đăng nhập</th>
                                <th class="p-2 border">Vai trò</th>
                                <th class="p-2 border">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users.content}" class="hover:bg-gray-100">
                                <td class="p-2 border" th:text="${user.userName}"></td>
                                <td class="p-2 border" th:text="${user.role.getRole()}"></td>
                                <td class="px-4 py-2 border">
                                    <a th:href="@{/user/delete/{userName}(userName=${user.userName})}" class="text-red-600 hover:underline"
                                       onclick="return confirm('Bạn có chắc chắn muốn xóa?')">Xóa</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Phân trang -->
                <div class="mt-4 flex justify-between items-center">
                    <div>
                        <a th:if="${users.hasPrevious()}" th:href="@{/user(page=${users.number - 1})}"
                           class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">Trước</a>
                    </div>
                    <div class="space-x-1">
                        <a th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}"
                           th:href="@{/user(page=${i})}"
                           th:class="${i == users.number} ? 'px-3 py-1 bg-blue-600 text-white rounded' : 'px-3 py-1 bg-gray-200 text-gray-800 rounded hover:bg-gray-300'"
                           th:text="${i + 1}"></a>
                    </div>
                    <div>
                        <a th:if="${users.hasNext()}" th:href="@{/user(page=${users.number + 1})}"
                           class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">Sau</a>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
