<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Sinh Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script>
        // Tự động ẩn thông báo sau 3 giây
        window.addEventListener('DOMContentLoaded', () => {
            const toasts = document.querySelectorAll('.toast');
            toasts.forEach(toast => {
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'translate-y-[-20px]');
                }, 3000);
            });
        });
    </script>
</head>
<body class="bg-gray-100 text-gray-800 relative">

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="flex">
    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar(activePage='sinhvien')}"></div>

    <!-- Main Content -->
    <div class="flex-1 p-6 space-y-6 ml-64 max-w-6xl mx-auto relative">

        <h1 class="text-3xl font-bold text-blue-700 mb-4">Quản Lý Sinh Viên</h1>

        <!-- Toast Thông báo -->
			<div class="fixed top-8 left-1/2 transform -translate-x-1/2 z-50 space-y-2 text-center w-full max-w-md px-4">

            <div th:if="${success}" class="toast transition transform duration-500 ease-in-out bg-green-500 text-white px-4 py-2 rounded shadow-lg">
                <p th:text="${success}"></p>
            </div>
            <div th:if="${error}" class="toast transition transform duration-500 ease-in-out bg-red-500 text-white px-4 py-2 rounded shadow-lg">
                <p th:text="${error}"></p>
            </div>
        </div>

        <!-- Form Thêm / Sửa Sinh Viên -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Thêm / Sửa Sinh Viên</h2>
            <form th:action="@{/sinhvien/save}" th:object="${sinhVien_DTO_}" method="post" class="space-y-4">
                <input type="hidden" name="page" th:value="${sinhVienPage.number}" />
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block font-medium">Mã Sinh Viên *</label>
                        <input type="text" th:field="*{maSV}" class="w-full border p-2 rounded-md" />
                        <span th:errors="*{maSV}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Họ Và Tên *</label>
                        <input type="text" th:field="*{hoVaTen}" class="w-full border p-2 rounded-md" />
                        <span th:errors="*{hoVaTen}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Ngày Sinh *</label>
                        <input type="date" th:field="*{ngaySinh}" th:value="${sinhVien_DTO_.ngaySinh != null ? #temporals.format(sinhVien_DTO_.ngaySinh, 'yyyy-MM-dd') : ''}" class="w-full border p-2 rounded-md" />
                        <span th:errors="*{ngaySinh}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Giới Tính *</label>
                        <select th:field="*{gioiTinh}" class="w-full border p-2 rounded-md">
                            <option value="">Chọn</option>
                            <option value="NAM">Nam</option>
                            <option value="Nu">Nữ</option>
                        </select>
                        <span th:errors="*{gioiTinh}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Email</label>
                        <input type="email" th:field="*{email}" class="w-full border p-2 rounded-md" />
                        <span th:errors="*{email}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Lớp *</label>
                        <select th:field="*{maLop}" class="w-full border p-2 rounded-md">
                            <option value="">Chọn</option>
                            <option th:each="lop : ${lopList}" th:value="${lop.maLop}" th:text="${lop.tenLop}"></option>
                        </select>
                        <span th:errors="*{maLop}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Khóa Học *</label>
                        <select th:field="*{maKhoaHoc}" class="w-full border p-2 rounded-md">
                            <option value="">Chọn</option>
                            <option th:each="khoaHoc : ${khoaHocList}" th:value="${khoaHoc.maKhoaHoc}" th:text="${khoaHoc.maKhoaHoc}"></option>
                        </select>
                        <span th:errors="*{maKhoaHoc}" class="text-sm text-red-500"></span>
                    </div>
                </div>
                <div class="flex space-x-2">
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Lưu</button>
                    <a th:href="@{/sinhvien(page=${sinhVienPage.number})}" class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400">Hủy</a>
                </div>
            </form>
        </div>

        <!-- Nhập / Xuất Excel -->
        <div class="flex justify-between items-center bg-white p-4 rounded-md shadow">
            <form th:action="@{/sinhvien/import}" method="post" enctype="multipart/form-data" class="flex items-center space-x-2">
                <input type="hidden" name="page" th:value="${sinhVienPage.number}" />
                <input type="file" name="file" accept=".xlsx" class="border p-1 rounded" />
                <button type="submit" class="bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700">Nhập</button>
            </form>
            <a th:href="@{/sinhvien/export}" class="text-blue-600 hover:underline">Xuất Excel</a>
        </div>

        <!-- Tìm kiếm -->
        <div class="bg-white p-6 rounded-md shadow space-y-4">
            <form th:action="@{/sinhvien}" method="get" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm mã SV hoặc tên"
                       class="col-span-2 border p-2 rounded-md" />
                <select name="maLop" class="border p-2 rounded-md">
                    <option value="">-- Lọc theo lớp --</option>
                    <option th:each="lop : ${lopList}" th:value="${lop.maLop}" th:text="${lop.tenLop}" th:selected="${maLop == lop.maLop}"></option>
                </select>
                <select name="maKhoa" class="border p-2 rounded-md">
                    <option value="">-- Lọc theo khoa --</option>
                    <option th:each="khoa : ${khoaList}" th:value="${khoa.maKhoa}" th:text="${khoa.tenKhoa}" th:selected="${maKhoa == khoa.maKhoa}"></option>
                </select>
                <select name="maKhoaHoc" class="border p-2 rounded-md">
                    <option value="">-- Lọc theo khóa học --</option>
                    <option th:each="khoaHoc : ${khoaHocList}" th:value="${khoaHoc.maKhoaHoc}" th:text="${khoaHoc.maKhoaHoc}" th:selected="${maKhoaHoc == khoaHoc.maKhoaHoc}"></option>
                </select>
                <div class="md:col-span-4">
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Tìm kiếm</button>
                </div>
            </form>
        </div>

        <!-- Danh sách sinh viên -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Danh Sách Sinh Viên</h2>
            <table class="w-full table-auto border-collapse">
                <thead>
                <tr class="bg-blue-100">
                    <th class="p-2 border">Mã SV</th>
                    <th class="p-2 border">Họ Tên</th>
                    <th class="p-2 border">Ngày Sinh</th>
                    <th class="p-2 border">Giới Tính</th>
                    <th class="p-2 border">Email</th>
                    <th class="p-2 border">Hành Động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="sv : ${sinhVienPage.content}" class="hover:bg-gray-100">
                    <td class="p-2 border" th:text="${sv.maSV}"></td>
                    <td class="p-2 border" th:text="${sv.hoVaTen}"></td>
                    <td class="p-2 border" th:text="${sv.ngaySinh}"></td>
                    <td class="p-2 border" th:text="${sv.gioiTinh}"></td>
                    <td class="p-2 border" th:text="${sv.email}"></td>
                    <td class="p-2 border space-x-2 text-sm">
                        <a th:href="@{|/sinhvien/edit/${sv.maSV}?page=${sinhVienPage.number}|}" class="text-blue-600 hover:underline">Sửa</a>
                        <a th:href="@{|/sinhvien/delete/${sv.maSV}?page=${sinhVienPage.number}|}" class="text-red-600 hover:underline" onclick="return confirm('Bạn có chắc chắn muốn xóa không?')">Xóa</a>
                    </td>
                </tr>
                </tbody>
            </table>

            <!-- Phân trang -->
            <div class="mt-4 flex justify-between items-center">
                <span>Trang <span th:text="${sinhVienPage.number + 1}"></span> / <span th:text="${sinhVienPage.totalPages}"></span></span>
                <div class="space-x-2">
                    <a th:href="@{/sinhvien(page=${sinhVienPage.number - 1}, keyword=${keyword}, maLop=${maLop}, maKhoa=${maKhoa}, maKhoaHoc=${maKhoaHoc})}"
                       th:if="${sinhVienPage.hasPrevious()}" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">Trước</a>
                    <a th:href="@{/sinhvien(page=${sinhVienPage.number + 1}, keyword=${keyword}, maLop=${maLop}, maKhoa=${maKhoa}, maKhoaHoc=${maKhoaHoc})}"
                       th:if="${sinhVienPage.hasNext()}" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">Sau</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
