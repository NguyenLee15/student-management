<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Phòng Học</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="flex">
    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar(activePage='phonghoc')}"></div>

    <!-- Main Content -->
    <div class="flex-1 p-6 space-y-6 ml-64 max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-blue-700 mb-4">Quản Lý Phòng Học</h1>

        <!-- Thông báo lỗi -->
        <div th:if="${error}" class="bg-red-100 text-red-700 px-4 py-2 rounded-md border border-red-400">
            <p th:text="${error}"></p>
        </div>

        <!-- Form thêm/sửa phòng học -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Thêm / Sửa Phòng Học</h2>
            <form th:action="@{/phonghoc/save}" th:object="${phongHocReq}" method="post" class="space-y-4">
                <input type="hidden" name="page" th:value="${phongHocPage.number}" />
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div>
                        <label class="block font-medium">Mã Phòng *</label>
                        <input type="text" th:field="*{maPhong}" class="w-full border border-gray-300 p-2 rounded-md" />
                        <span th:errors="*{maPhong}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Tên Phòng *</label>
                        <input type="text" th:field="*{tenPhong}" class="w-full border border-gray-300 p-2 rounded-md" />
                        <span th:errors="*{tenPhong}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Sức Chứa *</label>
                        <input type="number" th:field="*{sucChua}" class="w-full border border-gray-300 p-2 rounded-md" />
                        <span th:errors="*{sucChua}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Tòa Nhà *</label>
                        <select th:field="*{toaNha}" class="w-full border border-gray-300 p-2 rounded-md">
                            <option th:each="toa : ${toaNhaList}" th:value="${toa}" th:text="${toa}"></option>
                        </select>
                        <span th:errors="*{toaNha}" class="text-sm text-red-500"></span>
                    </div>
                </div>

                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Lưu</button>
            </form>
        </div>

        <!-- Tìm kiếm -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Tìm Kiếm</h2>
            <form th:action="@{/phonghoc}" method="get" class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                <div>
                    <label class="block font-medium">Tòa Nhà</label>
                    <select name="toaNha" class="w-full border border-gray-300 p-2 rounded-md">
                        <option value="">Tất cả</option>
                        <option th:each="toa : ${toaNhaList}" th:value="${toa}" th:text="${toa}" th:selected="${selectedToaNha == toa}"></option>
                    </select>
                </div>
      
                <div>
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition w-full">Tìm</button>
                </div>
            </form>
        </div>

        <!-- Danh sách phòng học -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Danh Sách Phòng Học</h2>
            <table class="w-full table-auto border-collapse">
                <thead>
                    <tr class="bg-blue-100 text-left">
                        <th class="p-2 border">Mã Phòng</th>
                        <th class="p-2 border">Tên Phòng</th>
                        <th class="p-2 border">Sức Chứa</th>
                        <th class="p-2 border">Tòa Nhà</th>
                        <th class="p-2 border">Hành Động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ph : ${phongHocPage.content}" class="hover:bg-gray-100">
                        <td class="p-2 border" th:text="${ph.maPhong}"></td>
                        <td class="p-2 border" th:text="${ph.tenPhong}"></td>
                        <td class="p-2 border" th:text="${ph.sucChua}"></td>
                        <td class="p-2 border" th:text="${ph.toaNha}"></td>
                        <td class="p-2 border space-x-2 text-sm">
                            <a th:href="@{|/phonghoc/edit/${ph.maPhong}?page=${phongHocPage.number}|}" class="text-blue-600 hover:underline">Sửa</a>
                            <a th:href="@{|/phonghoc/delete/${ph.maPhong}?page=${phongHocPage.number}|}"
                               class="text-red-600 hover:underline"
                               onclick="return confirm('Bạn có chắc chắn muốn xóa phòng học này không?')">Xóa</a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Phân trang -->
            <div class="mt-4 flex justify-between items-center">
                <span>Trang <span th:text="${phongHocPage.number + 1}"></span> / <span th:text="${phongHocPage.totalPages}"></span></span>
                <div class="space-x-2">
                    <a th:href="@{|/phonghoc?page=${phongHocPage.number - 1}&toaNha=${selectedToaNha}&keyword=${keyword}|}"
                       th:if="${phongHocPage.hasPrevious()}"
                       class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">Trước</a>
                    <a th:href="@{|/phonghoc?page=${phongHocPage.number + 1}&toaNha=${selectedToaNha}&keyword=${keyword}|}"
                       th:if="${phongHocPage.hasNext()}"
                       class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">Sau</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
