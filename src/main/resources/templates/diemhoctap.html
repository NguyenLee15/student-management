<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Điểm Học Tập</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="flex">
    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar(activePage='diemhoctap')}"></div>

    <!-- Main Content -->
    <div class="flex-1 p-6 space-y-6 ml-64 max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold text-blue-700 mb-4">Quản Lý Điểm Học Tập</h1>

        <!-- Toast Thông báo -->
        <div class="fixed top-8 left-1/2 transform -translate-x-1/2 z-50 space-y-2 text-center w-full max-w-md px-4">
            <div th:if="${success}" class="toast bg-green-500 text-white px-4 py-2 rounded shadow-lg">
                <p th:text="${success}"></p>
            </div>
            <div th:if="${error}" class="toast bg-red-500 text-white px-4 py-2 rounded shadow-lg">
                <p th:text="${error}"></p>
            </div>
        </div>

        <!-- Form Thêm / Sửa -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Thêm / Sửa Điểm</h2>
             <form th:action="@{${diemHocTap_DTO_.id != null} ? '/diemhoctap/update/' + ${diemHocTap_DTO_.id} : '/diemhoctap/save'}"
                  th:object="${diemHocTap_DTO_}" method="post" class="space-y-4">
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" name="page" th:value="${diemHocTapPage.number}" />
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block font-medium">Sinh Viên *</label>
                        <select th:field="*{maSV}" class="w-full border p-2 rounded-md">
                            <option value="">Chọn</option>
                            <option th:each="sv : ${sinhVienList}" th:value="${sv.maSV}" th:text="${sv.maSV + ' - ' + sv.hoVaTen}"></option>
                        </select>
                        <span th:errors="*{maSV}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Học Phần *</label>
                        <select th:field="*{maHocPhan}" class="w-full border p-2 rounded-md">
                            <option value="">Chọn</option>
                            <option th:each="hp : ${hocPhanList}" th:value="${hp.maHocPhan}" th:text="${hp.maHocPhan + ' - ' + hp.tenHocPhan}"></option>
                        </select>
                        <span th:errors="*{maHocPhan}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Học Kỳ *</label>
                        <select th:field="*{hocKy}" class="w-full border p-2 rounded-md">
                            <option value="">Chọn</option>
                            <option th:each="hk : ${hocKyList}" th:value="${hk}" th:text="${hk}"></option>
                        </select>
                        <span th:errors="*{hocKy}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Năm Học *</label>
                        <input type="text" th:field="*{namHoc}" placeholder="yyyy-yyyy" class="w-full border p-2 rounded-md" />
                        <span th:errors="*{namHoc}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Đợt *</label>
                        <select th:field="*{dot}" class="w-full border p-2 rounded-md">
                            <option value="">Chọn</option>
                            <option th:each="d : ${dotList}" th:value="${d}" th:text="${d}"></option>
                        </select>
                        <span th:errors="*{dot}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Điểm Thang 10 *</label>
                        <input type="number" th:field="*{diemThang10}" class="w-full border p-2 rounded-md" step="0.1" min="0" max="10" />
                        <span th:errors="*{diemThang10}" class="text-sm text-red-500"></span>
                    </div>
                </div>
                <div class="flex space-x-2">
				    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Lưu</button>
				    <a th:href="@{/diemhoctap(page=${diemHocTapPage.number})}" class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">Hủy</a>
				</div>

            </form>
        </div>

        <!-- Bộ Lọc + Nhập Xuất Excel -->
        <div class="bg-white p-4 rounded-md shadow space-y-4">
            <form th:action="@{/diemhoctap}" method="get" class="grid grid-cols-1 md:grid-cols-5 gap-4">
                <select name="maSV" class="border p-2 rounded-md">
                    <option value="">Tất cả SV</option>
                    <option th:each="sv : ${sinhVienList}" th:value="${sv.maSV}" th:text="${sv.maSV + ' - ' + sv.hoVaTen}" th:selected="${maSV == sv.maSV}"></option>
                </select>
                <select name="maHocPhan" class="border p-2 rounded-md">
                    <option value="">Tất cả học phần</option>
                    <option th:each="hp : ${hocPhanList}" th:value="${hp.maHocPhan}" th:text="${hp.maHocPhan}" th:selected="${maHocPhan == hp.maHocPhan}"></option>
                </select>
                <select name="hocKy" class="border p-2 rounded-md">
                    <option value="">Tất cả học kỳ</option>
                    <option th:each="hk : ${hocKyList}" th:value="${hk}" th:text="${hk}" th:selected="${hocKy == hk}"></option>
                </select>
                <select name="dot" class="border p-2 rounded-md">
                    <option value="">Tất cả đợt</option>
                    <option th:each="d : ${dotList}" th:value="${d}" th:text="${d}" th:selected="${dot == d}"></option>
                </select>
                <button type="submit" class="bg-gray-600 text-white px-4 py-2 rounded hover:bg-gray-700">Lọc</button>
            </form>

            <div class="flex justify-between items-center">
                <form th:action="@{/diemhoctap/import}" method="post" enctype="multipart/form-data" class="flex items-center space-x-2">
                    <input type="file" name="file" accept=".xlsx" class="border p-1 rounded" />
                    <button type="submit" class="bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700">Nhập Excel</button>
                </form>
                <a th:href="@{/diemhoctap/export}" class="text-blue-600 hover:underline">Xuất Excel</a>
            </div>
        </div>

        <!-- Danh sách điểm -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Danh Sách Điểm</h2>
            <table class="w-full table-auto border-collapse">
                <thead class="bg-blue-100">
                    <tr>
                        <th class="p-2 border">ID</th>
                        <th class="p-2 border">Sinh Viên</th>
                        <th class="p-2 border">Học Phần</th>
                        <th class="p-2 border">Học Kỳ</th>
                        <th class="p-2 border">Năm Học</th>
                        <th class="p-2 border">Đợt</th>
                        <th class="p-2 border">Điểm 10</th>
                        <th class="p-2 border">Điểm 4</th>
                        <th class="p-2 border">Điểm Chữ</th>
                        <th class="p-2 border">Hành Động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="d : ${diemHocTapPage.content}" class="hover:bg-gray-100">
                        <td class="p-2 border" th:text="${d.diemHocTapID}"></td>
                        <td class="p-2 border" th:text="${d.maSV + ' - ' + d.tenSV}"></td>
                        <td class="p-2 border" th:text="${d.maHocPhan + ' - ' + d.tenHocPhan}"></td>
                        <td class="p-2 border" th:text="${d.hocKy}"></td>
                        <td class="p-2 border" th:text="${d.namHoc}"></td>
                        <td class="p-2 border" th:text="${d.dot}"></td>
                        <td class="p-2 border" th:text="${d.diemThang10}"></td>
                        <td class="p-2 border" th:text="${d.diemThang4}"></td>
                        <td class="p-2 border" th:text="${d.diemChu}"></td>
                        <td class="p-2 border space-x-2 text-sm">
                            <a th:href="@{/diemhoctap/edit/{id}(id=${d.diemHocTapID},page=${diemHocTapPage.number})}" class="text-blue-600 hover:underline">Sửa</a>
                            <a th:href="@{/diemhoctap/delete/{id}(id=${d.diemHocTapID},page=${diemHocTapPage.number})}" class="text-red-600 hover:underline" onclick="return confirm('Xóa bản ghi này?')">Xóa</a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Phân trang -->
            <div class="mt-4 flex justify-between items-center">
                <span>Trang <span th:text="${diemHocTapPage.number + 1}"></span> / <span th:text="${diemHocTapPage.totalPages}"></span></span>
                <div class="space-x-2">
                    <a th:href="@{/diemhoctap(page=${diemHocTapPage.number - 1})}" th:if="${diemHocTapPage.hasPrevious()}" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">Trước</a>
                    <a th:href="@{/diemhoctap(page=${diemHocTapPage.number + 1})}" th:if="${diemHocTapPage.hasNext()}" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">Sau</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Auto-hide toast -->
<script>
    window.addEventListener('DOMContentLoaded', () => {
        const toasts = document.querySelectorAll('.toast');
        toasts.forEach(toast => {
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-5');
            }, 3000);
        });
    });
</script>

</body>
</html>
