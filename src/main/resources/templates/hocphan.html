<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Học Phần</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="flex">
    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar(activePage='hocphan')}"></div>

    <!-- Main Content -->
    <div class="flex-1 p-6 space-y-6 ml-64 max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-blue-700 mb-4">Quản Lý Học Phần</h1>

        <!-- Thông báo lỗi -->
        <div th:if="${error}" class="bg-red-100 text-red-700 px-4 py-2 rounded-md border border-red-400">
            <p th:text="${error}"></p>
        </div>

        <!-- Form thêm/sửa học phần -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Thêm / Sửa Học Phần</h2>
            <form th:action="@{/hocphan/save}" th:object="${hocPhanReq}" method="post" class="space-y-4">
                <input type="hidden" name="page" th:value="${hocPhanPage.number}" />
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block font-medium">Mã học phần *</label>
                        <input type="text" th:field="*{maHocPhan}" class="w-full border border-gray-300 p-2 rounded-md" />
                        <span th:errors="*{maHocPhan}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Tên học phần *</label>
                        <input type="text" th:field="*{tenHocPhan}" class="w-full border border-gray-300 p-2 rounded-md" />
                        <span th:errors="*{tenHocPhan}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Loại học phần *</label>
                        <select th:field="*{loaiHocPhan}" class="w-full border border-gray-300 p-2 rounded-md">
                            <option th:each="loai : ${loaiHocPhanList}" th:value="${loai}" th:text="${loai}"></option>
                        </select>
                        <span th:errors="*{loaiHocPhan}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Số tín chỉ *</label>
                        <input type="number" th:field="*{soTinChi}" class="w-full border border-gray-300 p-2 rounded-md" />
                        <span th:errors="*{soTinChi}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Số tiền tín chỉ *</label>
                        <input type="number" th:field="*{soTienTinChi}" class="w-full border border-gray-300 p-2 rounded-md" />
                        <span th:errors="*{soTienTinChi}" class="text-sm text-red-500"></span>
                    </div>
                    <div>
                        <label class="block font-medium">Khoa *</label>
                        <select th:field="*{maKhoa}" class="w-full border border-gray-300 p-2 rounded-md">
                            <option th:each="khoa : ${khoaList}" th:value="${khoa.maKhoa}" th:text="${khoa.tenKhoa}"></option>
                        </select>
                        <span th:errors="*{maKhoa}" class="text-sm text-red-500"></span>
                    </div>
                </div>
                <div class="flex space-x-2">
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Lưu</button>
                    <a th:href="@{/hocphan(page=${hocPhanPage.number})}" class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400">Hủy</a>
                </div>
            </form>
        </div>

        <!-- Nhập / Xuất Excel và Tìm kiếm -->
        <div class="bg-white p-4 rounded-md shadow space-y-4">
            <div class="flex justify-between items-center">
                <form th:action="@{/hocphan/import}" method="post" enctype="multipart/form-data" class="flex items-center space-x-2">
                    <input type="hidden" name="page" th:value="${hocPhanPage.number}" />
                    <input type="file" name="file" accept=".xlsx" class="border p-1 rounded" />
                    <button type="submit" class="bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700">Nhập</button>
                </form>
                <a th:href="@{/hocphan/export}" class="text-blue-600 hover:underline">Xuất Excel</a>
            </div>
        </div>

        <!-- Danh sách + Tìm kiếm học phần -->
<div class="bg-white p-6 rounded-lg shadow-md space-y-6">
    <div class="flex justify-between items-center">
        <h2 class="text-xl font-semibold">Danh Sách Học Phần</h2>

    </div>

    <!-- Tìm kiếm -->
    <form th:action="@{/hocphan}" method="get" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
            <label class="block font-medium">Loại học phần</label>
            <select name="loaiHocPhan" class="w-full border border-gray-300 p-2 rounded-md">
                <option value="">Tất cả</option>
                <option th:each="loai : ${loaiHocPhanList}" th:value="${loai}" th:text="${loai}" th:selected="${selectedLoaiHocPhan == loai}"></option>
            </select>
        </div>
        <div>
            <label class="block font-medium">Khoa</label>
            <select name="maKhoa" class="w-full border border-gray-300 p-2 rounded-md">
                <option value="">Tất cả</option>
                <option th:each="khoa : ${khoaList}" th:value="${khoa.maKhoa}" th:text="${khoa.tenKhoa}" th:selected="${selectedMaKhoa == khoa.maKhoa}"></option>
            </select>
        </div>
        <div class="flex items-end">
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Tìm</button>
        </div>
    </form>

    <!-- Bảng danh sách -->
    <table class="w-full table-auto border-collapse">
        <thead>
            <tr class="bg-blue-100">
                <th class="p-2 border">Mã học phần</th>
                <th class="p-2 border">Tên học phần</th>
                <th class="p-2 border">Loại học phần</th>
                <th class="p-2 border">Số tín chỉ</th>
                <th class="p-2 border">Số tiền tín chỉ</th>
                <th class="p-2 border">Khoa</th>
                <th class="p-2 border">Hành động</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="hp : ${hocPhanPage.content}" class="hover:bg-gray-100">
                <td class="p-2 border" th:text="${hp.maHocPhan}"></td>
                <td class="p-2 border" th:text="${hp.tenHocPhan}"></td>
                <td class="p-2 border" th:text="${hp.loaiHocPhan}"></td>
                <td class="p-2 border" th:text="${hp.soTinChi}"></td>
                <td class="p-2 border" th:text="${hp.soTienTinChi}"></td>
                <td class="p-2 border" th:text="${hp.tenKhoa}"></td>
                <td class="p-2 border space-x-2 text-sm">
                    <a th:href="@{/hocphan/edit/{maHocPhan}(maHocPhan=${hp.maHocPhan}, page=${hocPhanPage.number})}" class="text-blue-600 hover:underline">Sửa</a>
                    <a th:href="@{/hocphan/delete/{maHocPhan}(maHocPhan=${hp.maHocPhan}, page=${hocPhanPage.number})}" class="text-red-600 hover:underline" onclick="return confirm('Bạn có chắc chắn muốn xóa học phần này không?')">Xóa</a>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Phân trang -->
    <div class="mt-4 flex justify-between items-center">
        <span>Trang <span th:text="${hocPhanPage.number + 1}"></span> / <span th:text="${hocPhanPage.totalPages}"></span></span>
        <div class="space-x-2">
            <a th:href="@{/hocphan(page=${hocPhanPage.number - 1}, loaiHocPhan=${selectedLoaiHocPhan}, maKhoa=${selectedMaKhoa}, keyword=${keyword})}" th:if="${hocPhanPage.hasPrevious()}" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">Trước</a>
            <a th:href="@{/hocphan(page=${hocPhanPage.number + 1}, loaiHocPhan=${selectedLoaiHocPhan}, maKhoa=${selectedMaKhoa}, keyword=${keyword})}" th:if="${hocPhanPage.hasNext()}" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">Sau</a>
        </div>
    </div>
</div>
        </div>
    </div>

</body>
<!-- Footer -->
<footer class="mt-6">
    <div th:replace="~{fragments/footer :: footer}"></div>
</footer>	
</html>
