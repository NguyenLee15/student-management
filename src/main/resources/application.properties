spring.application.name=student-management
# Cấu hình Server
server.port=${PORT:8080}

# Cấu hình Database (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/qlsv?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.suffix=.html

# Cấu hình Email
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT cấu hình (Bảo mật qua Environment Variable)
jwt.secret=${JWT_SECRET:yourVeryLongSecretKeyThatIsAtLeast64CharactersLongToMeetHS512Requirements1234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}
spring.web.resources.static-locations=classpath:/static/
logging.level.org.springframework.security=INFO
logging.level.com.student.management=INFO
