spring.application.name=student-management
# Cấu hình Server
server.port=8080

# Cấu hình Database (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/qlsv?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Thymeleaf (nếu dùng)
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.suffix=.html

# Cấu hình Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT cấu hình
jwt.secret=yourVeryLongSecretKeyThatIsAtLeast64CharactersLongToMeetHS512Requirements1234567890
jwt.expiration=86400000
spring.web.resources.static-locations=classpath:/static/
logging.level.org.springframework.security=DEBUG
logging.level.com.example.student=DEBUG

