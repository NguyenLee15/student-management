name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'student-management/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'student-management/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./student-management

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml
