name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'student-management-frontend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'student-management-frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./student-management-frontend

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './student-management-frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build
