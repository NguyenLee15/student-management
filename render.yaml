services:
  - type: web
    name: eduportal-backend
    env: java
    rootDir: student-management
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/student-management-0.0.1-SNAPSHOT.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: JAVA_VERSION
        value: "21"
      - key: SPRING_PROFILES_ACTIVE
        value: "prod"
